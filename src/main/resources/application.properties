# ActiveMQ Configuration
activemq.broker.url=tcp://localhost:61616
activemq.username=user
activemq.password=pass
activemq.queue.name=nyx.jasper.queue
activemq.upload.queue.name=JASPER_UPLOAD

# Status Topic Configuration
activemq.status.topic=RPN_MODULE_INFO
status.interval.seconds=5

# Module Information
module.name=NYX_Jasper_Creator
module.version=1.0.1

# Jasper Reports Configuration
# Templates are specified in incoming JSON messages
jasper.output.directory=reports

# REST API Configuration
rest.api.enabled=true
rest.api.port=8080

# Application Settings
app.name=Nyx Jasper Creator
